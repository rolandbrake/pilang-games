<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />

  <title>Don't Touch My Presents</title>
  <link rel="icon" href="data/assets/gift.png" />

  <style>
    /* Reset default browser spacing */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #6293ed;
    }

    /* Center the game on the screen */
    body {
      display: flex;
      justify-content: center;
      align-items: center;

      /* Support mobile browser UI and safe areas */
      min-height: 100vh;
      min-height: 100dvh;

      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    canvas {
      display: block;

      border: 1px solid #000;

      /* Keep the canvas centered and responsive */
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;

      /* Fill the available screen without distortion */
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;

      outline: none;
      touch-action: none;
    }

    /* Responsive fullscreen layout for phones */
    @media (max-width: 768px) {
      html,
      body {
        width: 100%;
        height: 100%;
        height: 100dvh;
      }

      body {
        padding: 0;
      }

      canvas {
        max-width: 100vw;
        max-height: 100vh;
        max-height: 100dvh;
      }
    }
  </style>
</head>

<body>
  <canvas id="game"></canvas>

  <script type="module">
    import createPilang from "./pilang.js";

    const canvas = document.querySelector("#game");

    const app = await createPilang({
      canvas,
      noInitialRun: true,
    });

    const files = [
      "main.px",
      "data/audio/cheer.wav",
      "data/audio/cheer_2.wav",
      "data/audio/cheer_3.wav",
      "data/audio/cheer_4.wav",
      "data/audio/chop.wav",
      "data/audio/chop_2.wav",
      "data/audio/chop_3.wav",
      "data/audio/here_comes_santa.ogg",
      "data/audio/merry_christmas.ogg",
      "data/audio/score.wav",
      "data/audio/slap.wav",
      "data/audio/sleigh_ride.ogg",
      "data/assets/BaiJamjuree-Bold.ttf",
      "data/assets/blue_bg.png",
      "data/assets/dotted_line.png",
      "data/assets/gift.png",
      "data/assets/green_bg.png",
      "data/assets/left_hand.png",
      "data/assets/red_bg.png",
      "data/assets/right_hand.png",
      "data/assets/santa_hand.png",
      "data/assets/scoreboard.png",
      "data/menu/holding_gift.png",
      "data/menu/press_any_key.png",
      "data/menu/title.png",
    ];

    // Load all game assets into the virtual filesystem.
    for (const path of files) {
      const response = await fetch(path);

      if (!response.ok) {
        throw new Error(
          `Failed to load ${path}: ${response.status}`
        );
      }

      const buffer = new Uint8Array(
        await response.arrayBuffer()
      );

      const directory = "/" +
        path.split("/").slice(0, -1).join("/");

      app.FS.mkdirTree(directory);
      app.FS.writeFile("/" + path, buffer);
    }

    // Start the game.
    app.ccall(
      "execute_px",
      "number",
      ["string"],
      ["/main.px"]
    );

    // Recalculate the canvas display size when the screen changes.
    function resizeCanvas() {
      const width = window.visualViewport
        ? window.visualViewport.width
        : window.innerWidth;

      const height = window.visualViewport
        ? window.visualViewport.height
        : window.innerHeight;

      canvas.style.maxWidth = `${width}px`;
      canvas.style.maxHeight = `${height}px`;
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", resizeCanvas);

    if (window.visualViewport) {
      window.visualViewport.addEventListener(
        "resize",
        resizeCanvas
      );
    }

    resizeCanvas();
  </script>
</body>
</html>
